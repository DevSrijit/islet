name: Islet
options:
  bundleIdPrefix: com.devsrijit
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES
targets:
  Islet:
    type: application
    platform: macOS
    sources:
      - path: Islet
        excludes:
          - "Resources/Info.plist"
      - path: Vendor/MediaRemoteAdapter/mediaremote-adapter.pl
        buildPhase: resources
    dependencies:
      - framework: Vendor/MediaRemoteAdapter/MediaRemoteAdapter.framework
        embed: true
        link: false
        codeSign: true
    info:
      path: Islet/Resources/Info.plist
      properties:
        CFBundleName: Islet
        CFBundleDisplayName: Islet
        CFBundleIconName: AppIcon
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "MIT License. Copyright (c) 2026 Srijit Ghosh."
        NSCalendarsFullAccessUsageDescription: "Islet shows your next calendar event inside the notch."
        NSAudioCaptureUsageDescription: "Islet reads the system audio level to animate the live waveform. Nothing is recorded or stored."
        NSBluetoothAlwaysUsageDescription: "Islet shows a peek when AirPods and other Bluetooth accessories connect, with their battery level."
        NSAppleEventsUsageDescription: "Islet asks your browser which tab is playing so it can show the site's icon."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devsrijit.Islet
        PRODUCT_NAME: Islet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
